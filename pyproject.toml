[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-integrity-studio"
version = "0.8.0"
description = "Local-first Unicode inspection and safe text-cleaning framework"
requires-python = ">=3.11"
dependencies = ["pypdf==6.17.0"]

[project.scripts]
text-integrity = "text_integrity.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/text_integrity"]
