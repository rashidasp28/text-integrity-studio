name: Build standalone alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "text-integrity-studio.spec"
      - "pyproject.toml"
      - ".github/workflows/build-alpha.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: text-integrity-studio-windows
          - os: macos-latest
            artifact: text-integrity-studio-macos
          - os: ubuntu-latest
            artifact: text-integrity-studio-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install . pyinstaller==6.15.0
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: pyinstaller --clean --noconfirm text-integrity-studio.spec
      - name: Record checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum Text-Integrity-Studio* > SHA256SUMS.txt
          else
            shasum -a 256 Text-Integrity-Studio* > SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Text-Integrity-Studio*
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package platform artifacts
        run: |
          cd release-artifacts
          for directory in */; do zip -r "${directory%/}.zip" "$directory"; done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*.zip
