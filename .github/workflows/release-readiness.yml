name: Release readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  security-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and pinned audit tools
        run: python -m pip install . pip-audit==2.10.1 bandit==1.9.4 cyclonedx-bom==7.3.1
      - name: Release gate verification
        run: python scripts/release_check.py --output release-readiness.json
      - name: Static security analysis
        run: bandit -r src -ll -ii -f json -o bandit-report.json
      - name: Dependency vulnerability audit
        run: pip-audit --requirement requirements-runtime.txt --format=json --output=pip-audit-report.json
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements-runtime.txt --output-format JSON --output-file sbom.cdx.json
      - name: Regression and acceptance automation
        run: |
          python scripts/validate_corpus.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-evidence
          path: |
            release-readiness.json
            bandit-report.json
            pip-audit-report.json
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
